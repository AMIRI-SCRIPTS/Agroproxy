<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AGRO — Browser</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #14141c;
    --surface-2: #1c1c28;
    --border: #26263a;
    --text: #e8e8f0;
    --text-dim: #8a8aa0;
    --accent: #6366f1;
    --accent-hover: #7c7ff2;
    --success: #22c55e;
    --radius: 10px;
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* ---------- Top Bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    -webkit-app-region: drag;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.5px;
    user-select: none;
  }

  .logo-mark {
    width: 26px;
    height: 26px;
    border-radius: 7px;
    background: linear-gradient(135deg, var(--accent), #a855f7);
    display: grid;
    place-items: center;
    font-size: 13px;
    font-weight: 800;
    color: white;
    box-shadow: 0 2px 10px rgba(99,102,241,0.4);
  }

  /* ---------- Nav Buttons ---------- */
  .nav-btns {
    display: flex;
    gap: 4px;
    -webkit-app-region: no-drag;
  }

  .icon-btn {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: all 0.15s ease;
    -webkit-app-region: no-drag;
  }

  .icon-btn:hover:not(:disabled) {
    background: var(--surface-2);
    color: var(--text);
  }

  .icon-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .icon-btn svg { width: 16px; height: 16px; }

  /* ---------- Address Bar ---------- */
  .address-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0 12px;
    height: 38px;
    transition: border-color 0.15s, box-shadow 0.15s;
    -webkit-app-region: no-drag;
  }

  .address-wrap:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
  }

  .lock-icon {
    color: var(--success);
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }

  .lock-icon svg { width: 13px; height: 13px; }

  #address {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 13.5px;
    font-family: inherit;
  }

  #address::placeholder { color: var(--text-dim); }

  /* ---------- Tabs Strip ---------- */
  .tabs {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 12px 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }

  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    font-size: 12.5px;
    color: var(--text-dim);
    cursor: pointer;
    max-width: 200px;
    white-space: nowrap;
    transition: all 0.15s;
    user-select: none;
  }

  .tab.active {
    background: var(--bg);
    color: var(--text);
    border-color: var(--border);
    border-bottom: 1px solid var(--bg);
    margin-bottom: -1px;
  }

  .tab-title {
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }

  .tab-close {
    width: 16px;
    height: 16px;
    border-radius: 4px;
    display: grid;
    place-items: center;
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1;
    flex-shrink: 0;
  }

  .tab-close:hover {
    background: rgba(255,255,255,0.1);
    color: var(--text);
  }

  .new-tab {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 18px;
    display: grid;
    place-items: center;
    flex-shrink: 0;
    margin-bottom: 4px;
  }

  .new-tab:hover {
    background: var(--surface-2);
    color: var(--text);
  }

  /* ---------- Viewport ---------- */
  .viewport {
    flex: 1;
    position: relative;
    background: var(--bg);
  }

  .page {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
  }

  .page.active { display: flex; }

  .frame {
    flex: 1;
    border: none;
    width: 100%;
    background: white;
  }

  /* ---------- New Tab / Home Page ---------- */
  .home {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    gap: 32px;
    background: radial-gradient(circle at 50% 0%, rgba(99,102,241,0.08), transparent 60%);
  }

  .home-logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .home-mark {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--accent), #a855f7);
    display: grid;
    place-items: center;
    font-size: 28px;
    font-weight: 800;
    color: white;
    box-shadow: 0 10px 40px rgba(99,102,241,0.35);
  }

  .home-title {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .home-sub {
    font-size: 13px;
    color: var(--text-dim);
  }

  .quick-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 12px;
    width: 100%;
    max-width: 640px;
  }

  .quick-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 16px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.15s ease;
    text-decoration: none;
    color: var(--text);
  }

  .quick-card:hover {
    background: var(--surface-2);
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  .quick-icon {
    width: 36px;
    height: 36px;
    border-radius: 9px;
    display: grid;
    place-items: center;
    font-size: 18px;
    background: var(--surface-2);
  }

  .quick-name {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-dim);
  }

  /* ---------- Status Bar ---------- */
  .statusbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-dim);
    height: 24px;
  }

  .status-left, .status-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--success);
  }

  /* ---------- Loading bar ---------- */
  .loadbar {
    position: absolute;
    top: 0;
    left: 0;
    height: 2px;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), #a855f7);
    transition: width 0.3s ease, opacity 0.3s;
    z-index: 10;
    opacity: 0;
  }

  .loadbar.active {
    opacity: 1;
    animation: load 1.5s infinite;
  }

  @keyframes load {
    0% { width: 0%; }
    50% { width: 70%; }
    100% { width: 100%; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="logo">
      <div class="logo-mark">A</div>
      <span>AGRO</span>
    </div>

    <div class="nav-btns">
      <button class="icon-btn" id="backBtn" title="Back" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <button class="icon-btn" id="fwdBtn" title="Forward" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
      <button class="icon-btn" id="reloadBtn" title="Reload">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
    </div>

    <div class="address-wrap">
      <div class="lock-icon" id="lockIcon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <input
        id="address"
        type="text"
        placeholder="Search or enter a URL"
        autocomplete="off"
        spellcheck="false"
      />
    </div>

    <div class="nav-btns">
      <button class="icon-btn" id="homeBtn" title="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </button>
      <button class="icon-btn" id="menuBtn" title="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
      </button>
    </div>
  </div>

  <!-- TABS -->
  <div class="tabs" id="tabs">
    <button class="new-tab" id="newTabBtn" title="New tab">+</button>
  </div>

  <!-- VIEWPORT -->
  <div class="viewport" id="viewport">
    <div class="loadbar" id="loadbar"></div>
  </div>

  <!-- STATUS BAR -->
  <div class="statusbar">
    <div class="status-left">
      <span><span class="status-dot"></span> Ready</span>
    </div>
    <div class="status-right">
      <span id="statusUrl">about:blank</span>
      <span>AGRO v0.1</span>
    </div>
  </div>

</div>

<script>
/* ============================================================
   AGRO Browser — Core Logic
   Frontend shell. Proxy integration comes next step.
   ============================================================ */

const state = {
  tabs: [],           // { id, title, url, history: [], historyIndex }
  activeId: null,
  tabCounter: 0,
};

/* ---------- Utilities ---------- */

// Normalize a user input into a real URL
function normalizeInput(raw) {
  if (!raw) return null;
  let input = raw.trim();
  if (!input) return null;

  // If it already looks like a URL
  if (/^https?:\/\//i.test(input)) return input;

  // If it has a dot and no spaces, assume https
  if (/^[^\s]+\.[^\s]{2,}/.test(input) && !input.includes(" ")) {
    return "https://" + input;
  }

  // Otherwise treat as a search query (DuckDuckGo for privacy)
  return "https://duckduckgo.com/?q=" + encodeURIComponent(input);
}

// Friendly title from a URL
function titleFromUrl(url) {
  try {
    const u = new URL(url);
    return u.hostname.replace(/^www\./, "");
  } catch {
    return "New Tab";
  }
}

/* ---------- Tab Creation ---------- */

function createTab(url = null) {
  const id = ++state.tabCounter;
  const tab = {
    id,
    title: url ? titleFromUrl(url) : "New Tab",
    url: url,
    history: url ? [url] : [],
    historyIndex: url ? 0 : -1,
  };
  state.tabs.push(tab);
  renderTab(tab);
  activateTab(id);
  return tab;
}

function getActiveTab() {
  return state.tabs.find(t => t.id === state.activeId);
}

/* ---------- Rendering ---------- */

function renderTab(tab) {
  const tabsEl = document.getElementById("tabs");
  const newTabBtn = document.getElementById("newTabBtn");

  const el = document.createElement("div");
  el.className = "tab";
  el.dataset.id = tab.id;
  el.innerHTML = `
    <span class="tab-title">${tab.title}</span>
    <span class="tab-close" data-close="${tab.id}">×</span>
  `;
  el.addEventListener("click", (e) => {
    if (e.target.dataset.close) {
      closeTab(Number(e.target.dataset.close));
    } else {
      activateTab(tab.id);
    }
  });
  tabsEl.insertBefore(el, newTabBtn);
}

function updateTabEl(tab) {
  const el = document.querySelector(`.tab[data-id="${tab.id}"]`);
  if (!el) return;
  el.querySelector(".tab-title").textContent = tab.title;
}

function renderPage(tab) {
  const viewport = document.getElementById("viewport");

  // Remove existing page for this tab if present
  const existing = document.getElementById(`page-${tab.id}`);
  if (existing) existing.remove();

  const page = document.createElement("div");
  page.className = "page";
  page.id = `page-${tab.id}`;

  if (tab.url) {
    page.innerHTML = `<iframe class="frame" id="frame-${tab.id}" src="${tab.url}" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals"></iframe>`;
  } else {
    page.innerHTML = homePageHTML();
    bindHomePage(page);
  }

  viewport.appendChild(page);

  // Attach load listener
  const frame = page.querySelector("iframe");
  if (frame) {
    frame.addEventListener("load", () => {
      stopLoading();
      try {
        const doc = frame.contentDocument;
        if (doc && doc.title) {
          tab.title = doc.title.slice(0, 40);
          updateTabEl(tab);
        }
      } catch { /* cross-origin — expected */ }
    });
  }

  return page;
}

function activateTab(id) {
  state.activeId = id;
  const tab = getActiveTab();
  if (!tab) return;

  // Update tab styling
  document.querySelectorAll(".tab").forEach(el => {
    el.classList.toggle("active", Number(el.dataset.id) === id);
  });

  // Show the right page
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  let page = document.getElementById(`page-${tab.id}`);
  if (!page) page = renderPage(tab);
  page.classList.add("active");

  // Sync address bar
  document.getElementById("address").value = tab.url || "";

  // Sync nav buttons
  updateNavButtons();

  // Status bar
  document.getElementById("statusUrl").textContent = tab.url || "about:blank";
}

function closeTab(id) {
  const idx = state.tabs.findIndex(t => t.id === id);
  if (idx === -1) return;

  state.tabs.splice(idx, 1);
  const tabEl = document.querySelector(`.tab[data-id="${id}"]`);
  if (tabEl) tabEl.remove();
  const pageEl = document.getElementById(`page-${id}`);
  if (pageEl) pageEl.remove();

  if (state.activeId === id) {
    const next = state.tabs[idx] || state.tabs[idx - 1];
    if (next) activateTab(next.id);
    else createTab();
  } else {
    updateNavButtons();
  }
}

/* ---------- Navigation ---------- */

function navigate(input) {
  const tab = getActiveTab();
  if (!tab) return;

  const url = normalizeInput(input);
  if (!url) return;

  // Truncate forward history
  tab.history = tab.history.slice(0, tab.historyIndex + 1);
  tab.history.push(url);
  tab.historyIndex = tab.history.length - 1;
  tab.url = url;
  tab.title = titleFromUrl(url);

  updateTabEl(tab);
  document.getElementById("address").value = url;
  document.getElementById("statusUrl").textContent = url;

  startLoading();

  // Re-render the page
  const oldPage = document.getElementById(`page-${tab.id}`);
  if (oldPage) oldPage.remove();
  const page = renderPage(tab);
  page.classList.add("active");

  updateNavButtons();
}

function goBack() {
  const tab = getActiveTab();
  if (!tab || tab.historyIndex <= 0) return;
  tab.historyIndex--;
  tab.url = tab.history[tab.historyIndex];
  document.getElementById("address").value = tab.url;
  startLoading();
  const oldPage = document.getElementById(`page-${tab.id}`);
  if (oldPage) oldPage.remove();
  const page = renderPage(tab);
  page.classList.add("active");
  updateNavButtons();
}

function goForward() {
  const tab = getActiveTab();
  if (!tab || tab.historyIndex >= tab.history.length - 1) return;
  tab.historyIndex++;
  tab.url = tab.history[tab.historyIndex];
  document.getElementById("address").value = tab.url;
  startLoading();
  const oldPage = document.getElementById(`page-${tab.id}`);
  if (oldPage) oldPage.remove();
  const page = renderPage(tab);
  page.classList.add("active");
  updateNavButtons();
}

function reload() {
  const tab = getActiveTab();
  if (!tab || !tab.url) return;
  startLoading();
  const oldPage = document.getElementById(`page-${tab.id}`);
  if (oldPage) oldPage.remove();
  const page = renderPage(tab);
  page.classList.add("active");
}

function goHome() {
  const tab = getActiveTab();
  if (!tab) return;
  tab.url = null;
  tab.title = "New Tab";
  document.getElementById("address").value = "";
  document.getElementById("statusUrl").textContent = "about:blank";
  updateTabEl(tab);
  const oldPage = document.getElementById(`page-${tab.id}`);
  if (oldPage) oldPage.remove();
  const page = renderPage(tab);
  page.classList.add("active");
  updateNavButtons();
}

function updateNavButtons() {
  const tab = getActiveTab();
  document.getElementById("backBtn").disabled = !tab || tab.historyIndex <= 0;
  document.getElementById("fwdBtn").disabled = !tab || tab.historyIndex >= tab.history.length - 1;
}

/* ---------- Loading Indicator ---------- */

let loadTimer = null;
function startLoading() {
  const bar = document.getElementById("loadbar");
  bar.classList.add("active");
  clearTimeout(loadTimer);
  loadTimer = setTimeout(stopLoading, 4000);
}

function stopLoading() {
  const bar = document.getElementById("loadbar");
  bar.classList.remove("active");
  clearTimeout(loadTimer);
}

/* ---------- Home Page ---------- */

function homePageHTML() {
  const shortcuts = [
    { name: "TikTok",    url: "https://www.tiktok.com",  icon: "🎵" },
    { name: "Discord",   url: "https://discord.com/app", icon: "💬" },
    { name: "ChatGPT",   url: "https://chat.openai.com", icon: "🤖" },
    { name: "Claude",    url: "https://claude.ai",       icon: "🧠" },
    { name: "YouTube",   url: "https://youtube.com",     icon: "▶️" },
    { name: "GitHub",    url: "https://github.com",      icon: "🐙" },
    { name: "Reddit",    url: "https://reddit.com",      icon: "👽" },
    { name: "Wikipedia", url: "https://wikipedia.org",   icon: "📚" },
  ];

  return `
    <div class="home">
      <div class="home-logo">
        <div class="home-mark">A</div>
        <div class="home-title">AGRO</div>
        <div class="home-sub">A clean, fast browsing experience.</div>
      </div>
      <div class="quick-grid">
        ${shortcuts.map(s => `
          <div class="quick-card" data-url="${s.url}">
            <div class="quick-icon">${s.icon}</div>
            <div class="quick-name">${s.name}</div>
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

function bindHomePage(pageEl) {
  pageEl.querySelectorAll(".quick-card").forEach(card => {
    card.addEventListener("click", () => {
      navigate(card.dataset.url);
    });
  });
}

/* ---------- Event Wiring ---------- */

document.getElementById("address").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    navigate(e.target.value);
    e.target.blur();
  }
});

document.getElementById("backBtn").addEventListener("click", goBack);
document.getElementById("fwdBtn").addEventListener("click", goForward);
document.getElementById("reloadBtn").addEventListener("click", reload);
document.getElementById("homeBtn").addEventListener("click", goHome);

document.getElementById("newTabBtn").addEventListener("click", () => createTab());

// Keyboard shortcuts
document.addEventListener("keydown", (e) => {
  // Ctrl/Cmd + T
  if ((e.ctrlKey || e.metaKey) && e.key === "t") {
    e.preventDefault();
    createTab();
  }
  // Ctrl/Cmd + W
  if ((e.ctrlKey || e.metaKey) && e.key === "w") {
    e.preventDefault();
    if (state.activeId) closeTab(state.activeId);
  }
  // Ctrl/Cmd + L → focus address bar
  if ((e.ctrlKey || e.metaKey) && e.key === "l") {
    e.preventDefault();
    document.getElementById("address").focus();
    document.getElementById("address").select();
  }
});

/* ---------- Boot ---------- */

createTab();
</script>

</body>
</html>
